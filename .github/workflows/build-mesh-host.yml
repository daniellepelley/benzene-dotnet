# Compiles deploy/Mesh/Benzene.Mesh.Host.sln - this deployable is a production-ready primitive
# (a real tool developers run against real services), not an example/demo, so unlike examples/ it
# gets real CI coverage rather than being left to build only when someone remembers to.

name: Build Mesh Host

on:
  push:
    branches: [ "main" ]
    paths:
      - 'deploy/Mesh/**'
      - 'src/Benzene.Mesh.Aggregator/**'
      - 'src/Benzene.Mesh.Artifacts/**'
      - 'src/Benzene.Mesh.Aws.Lambda/**'
      - 'src/Benzene.Mesh.Aws.S3/**'
      - 'src/Benzene.Mesh.Azure.Blob/**'
      - 'src/Benzene.Mesh.Collector/**'
      - 'src/Benzene.Mesh.Contracts/**'
      - 'src/Benzene.Mesh.Dispatch/**'
      - 'src/Benzene.Mesh.Fleet.Aws.XRay/**'
      - 'src/Benzene.Mesh.Fleet.Jaeger/**'
      - 'src/Benzene.Mesh.Fleet.Tempo/**'
      - 'src/Benzene.Mesh.GoogleCloud.Storage/**'
      - 'src/Benzene.Mesh.Tracing.Tempo/**'
      - 'src/Benzene.Mesh.Ui/**'
      - 'src/Benzene.Mesh.Usage.ApplicationInsights/**'
      - 'src/Benzene.Mesh.Usage.CloudWatch/**'
      - '.github/workflows/build-mesh-host.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'deploy/Mesh/**'
      - 'src/Benzene.Mesh.Aggregator/**'
      - 'src/Benzene.Mesh.Artifacts/**'
      - 'src/Benzene.Mesh.Aws.Lambda/**'
      - 'src/Benzene.Mesh.Aws.S3/**'
      - 'src/Benzene.Mesh.Azure.Blob/**'
      - 'src/Benzene.Mesh.Collector/**'
      - 'src/Benzene.Mesh.Contracts/**'
      - 'src/Benzene.Mesh.Dispatch/**'
      - 'src/Benzene.Mesh.Fleet.Aws.XRay/**'
      - 'src/Benzene.Mesh.Fleet.Jaeger/**'
      - 'src/Benzene.Mesh.Fleet.Tempo/**'
      - 'src/Benzene.Mesh.GoogleCloud.Storage/**'
      - 'src/Benzene.Mesh.Tracing.Tempo/**'
      - 'src/Benzene.Mesh.Ui/**'
      - 'src/Benzene.Mesh.Usage.ApplicationInsights/**'
      - 'src/Benzene.Mesh.Usage.CloudWatch/**'
      - '.github/workflows/build-mesh-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mesh-host:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore deploy/Mesh/Benzene.Mesh.Host.sln
    - name: Build
      run: dotnet build deploy/Mesh/Benzene.Mesh.Host.sln --no-restore
    - name: Test
      run: dotnet test deploy/Mesh/Benzene.Mesh.Host.sln --no-build

  # #275: deploy/Mesh/helm/benzene-mesh (the chart that deploys the host this workflow just built) had
  # zero CI validation of any kind. Near-zero cost, no cluster needed - a full `helm install --dry-run`
  # against a throwaway kind cluster is the documented optional stretch (see deploy-k8s-mesh-example.yml
  # for the kind-cluster pattern to reuse if that's ever added), not required here.
  helm-lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.16.1'
    - name: helm lint
      run: helm lint --strict deploy/Mesh/helm/benzene-mesh
    - name: helm template
      run: helm template benzene-mesh deploy/Mesh/helm/benzene-mesh > /tmp/benzene-mesh-rendered.yaml
    # `helm template --validate` needs a live, reachable cluster (it round-trips through the current
    # kube context's API discovery) - not available on a plain runner, and not what "no cluster needed"
    # meant here. `kubectl apply --dry-run=client` gets the same rendered-manifest schema validation
    # (malformed resources, unknown fields, bad apiVersion/kind) entirely client-side, using kubectl's
    # bundled OpenAPI schemas - zero cluster cost, which the literal --validate flag can't offer.
    - name: Validate rendered manifests (client-side, no cluster)
      run: kubectl apply --dry-run=client -f /tmp/benzene-mesh-rendered.yaml
