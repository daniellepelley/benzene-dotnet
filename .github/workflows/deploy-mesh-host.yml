# Publishes the Benzene.Mesh.Host Docker image to GHCR (ghcr.io/<owner>/benzene-mesh) and the
# benzene-mesh dotnet tool package to GitHub Packages' NuGet feed.
# The first Docker image publish anywhere in this repo - flagged explicitly, even though the
# trigger pattern (manual workflow_dispatch, nothing auto-publishes) matches every other deploy
# workflow already in this repo (deploy-benzene.yml, deploy-templates.yml).
#
# Uses the built-in GITHUB_TOKEN for both jobs' auth (no separate secret needed, unlike the
# AWS/GCP example deploy workflows or deploy-templates.yml's NuGet.org push) - requires the
# "packages: write" permission below.

name: Deploy Mesh Host

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine image tags
      id: tags
      run: |
        IMAGE="ghcr.io/${{ github.repository_owner }}/benzene-mesh"
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        echo "sha_tag=$IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "latest_tag=$IMAGE:latest" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        # Build context is the repo root - Benzene.Mesh.Host references sibling src/ projects by
        # relative path, so the whole repo has to be in the build context (see the Dockerfile's
        # own comment).
        context: .
        file: deploy/Mesh/Benzene.Mesh.Host/Dockerfile
        push: true
        tags: |
          ${{ steps.tags.outputs.sha_tag }}
          ${{ steps.tags.outputs.latest_tag }}

  publish-tool:
    # Independent of the image job (task 5.4, work/enterprise/slice-5-packaging.md) - the tool
    # (task 5.3) is the same binary packaged a different way, not a build artifact of the image
    # job, so it packs and pushes on its own rather than depending on `deploy`.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Pack
      run: dotnet pack deploy/Mesh/Benzene.Mesh.Host/Benzene.Mesh.Host.csproj -c Release -o ./mesh-host-pack

    - name: Publish to GitHub Packages
      run: |
        dotnet nuget add source \
          --username ${{ github.actor }} \
          --password ${{ secrets.GITHUB_TOKEN }} \
          --store-password-in-clear-text \
          --name github \
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
        # --skip-duplicate: re-running this workflow against an unchanged VersionPrefix/
        # VersionSuffix (deploy/Mesh/Benzene.Mesh.Host/Benzene.Mesh.Host.csproj) must not fail the
        # job - the version bump is a separate, deliberate edit to that file, not something CI
        # computes on every run.
        dotnet nuget push ./mesh-host-pack/*.nupkg --source github --skip-duplicate
