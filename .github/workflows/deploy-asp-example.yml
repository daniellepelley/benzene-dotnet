name: Deploy Asp Function Example

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./examples/Asp/Benzene.Examples.Asp
jobs:
  build:
    environment: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      working-directory: ./examples/Asp/Benzene.Examples.Asp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Build
      run: dotnet build Benzene.Examples.Asp.csproj --configuration Release
    
    - name: Publish
      run: dotnet publish --no-restore Benzene.Examples.Asp.csproj --configuration Release -o ./myApp
    
    - name: 'Run Azure Functions action'
      uses: Azure/functions-action@v1
      with:
        app-name: benzene-example
        package: ./examples/Asp/Benzene.Examples.Asp/myApp
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }} 
