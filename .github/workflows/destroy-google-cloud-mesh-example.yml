# Manual-only teardown for examples/GoogleCloudMesh — the counterpart of "Deploy Google Cloud Mesh
# Example".
#
# WHY THIS EXISTS: the deployed demo bills while it merely exists — eight Gen2 Cloud Functions (each a
# Cloud Run service), the Pub/Sub inbox topics, the mesh GCS bucket, a Cloud Scheduler job and the
# runtime service account. Tear the stack down when you are done demoing and redeploy in minutes.
#
# TWO teardown layers, because the deploy provisions in two ways:
#  * The Cloud Functions are created OUTSIDE Terraform (`gcloud functions deploy`), so `terraform
#    destroy` never sees them. They are deleted here first, by name, via gcloud — before the Terraform
#    pass, so removing the topics/service-account they use doesn't fail on an in-use dependency.
#  * Everything else (topics, bucket [force_destroy], service account, IAM, the scheduler job) is
#    Terraform-managed and removed by `terraform destroy` against the SAME remote GCS state the deploy
#    wrote. mesh_refresh_url defaults to "" so the scheduler's count goes to 0 and it is destroyed.
name: Destroy Google Cloud Mesh Example

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Google Cloud project id (must match the deploy)"
        required: true
        default: "smart-theory-88114"
      region:
        description: "Region (must match the deploy)"
        required: false
        default: "europe-west2"
      state_bucket:
        description: "GCS bucket holding the Terraform state (must match the deploy)"
        required: true
        default: "benzenemesh"
      delete_state_bucket:
        description: "Also delete the Terraform state bucket (full cleanup; a redeploy then starts from scratch)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  NAME_PREFIX: benzene-gcpmesh
  TF_DIR: examples/GoogleCloudMesh/deploy

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3

      # 1. Delete the out-of-band Gen2 functions first (Terraform doesn't manage them). Deleting a Gen2
      #    function removes its backing Cloud Run service and any Eventarc trigger. Tolerate absence so a
      #    partial deploy still tears down. Do this BEFORE terraform destroy so the topics and runtime
      #    service account they depend on aren't in-use when Terraform removes them.
      - name: Delete Cloud Functions
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
        run: |
          for FN in orders payments shipping notifications mesh \
                    payments-sub shipping-sub notifications-sub; do
            echo "Deleting function $NAME_PREFIX-$FN (if present)"
            gcloud functions delete "$NAME_PREFIX-$FN" --gen2 --region "$REGION" \
              --project "$PROJECT" --quiet || true
          done

      # 2. Destroy the Terraform-managed infra against the same remote state. If the state bucket is
      #    missing there is nothing deployed here — say so plainly rather than creating one.
      - name: Terraform destroy (infra)
        working-directory: ${{ env.TF_DIR }}
        env:
          PROJECT: ${{ github.event.inputs.project }}
          REGION: ${{ github.event.inputs.region }}
          STATE_BUCKET: ${{ github.event.inputs.state_bucket }}
        run: |
          if ! gcloud storage buckets describe "gs://$STATE_BUCKET" >/dev/null 2>&1; then
            echo "::error::No Terraform state bucket (gs://$STATE_BUCKET) — nothing to destroy here. Check the state_bucket/project match the deploy."
            exit 1
          fi
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="prefix=google-cloud-mesh"
          # mesh_refresh_url defaults to "" -> scheduler count 0 -> destroyed; the mesh bucket is
          # force_destroy, so Terraform empties it before deleting.
          terraform destroy -input=false -auto-approve \
            -var "project=$PROJECT" \
            -var "region=$REGION"

      # 3. Full cleanup: delete the Terraform state bucket too (a redeploy then starts from scratch).
      - name: Delete the Terraform state bucket
        if: ${{ inputs.delete_state_bucket }}
        continue-on-error: true
        env:
          STATE_BUCKET: ${{ github.event.inputs.state_bucket }}
        run: |
          echo "Deleting state bucket gs://$STATE_BUCKET"
          gcloud storage rm --recursive "gs://$STATE_BUCKET" --quiet || true

      - name: Confirm teardown
        run: |
          echo "GoogleCloudMesh stack destroyed in ${{ github.event.inputs.region }} (project ${{ github.event.inputs.project }})."
          if [ "${{ inputs.delete_state_bucket }}" = "true" ]; then
            echo "Terraform state bucket deletion was requested."
          else
            echo "Kept the Terraform state bucket for a cheap redeploy."
          fi
