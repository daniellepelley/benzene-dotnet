name: One-off - copy AWS creds to the-count

# Copies this repo's AWS_ACCESS_KEY_ID variable and AWS_SECRET_ACCESS_KEY secret onto
# daniellepelley/the-count, so its Deploy workflow can authenticate as the same IAM user this
# repo's own AWS example workflows use. Run once by hand from the Actions tab, then delete this
# branch (and this workflow with it) — it has no other purpose, and a workflow that can write
# secrets into another repo shouldn't be left lying around on main.
#
# Requires a repository secret on THIS repo, TARGET_REPO_TOKEN: a GitHub PAT that GITHUB_TOKEN
# cannot substitute for, since GITHUB_TOKEN is only ever valid for the repo a workflow runs in.
# Use a fine-grained PAT scoped to just daniellepelley/the-count, with repository permissions
# "Secrets" and "Variables" both set to Read and write. Remove/revoke it once this has run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY live in the "test" GitHub Environment on this repo
    # (see mesh-example-aws-deploy.yml) — a job must declare the environment for them to be exposed.
    environment: test
    env:
      GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
      SOURCE_AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      SOURCE_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Verify source and target credentials are available
        run: |
          missing=0
          [ -z "$GH_TOKEN" ] && { echo "::error::TARGET_REPO_TOKEN is empty — add a PAT scoped to daniellepelley/the-count (Secrets + Variables: read and write) as a secret on this repo."; missing=1; }
          [ -z "$SOURCE_AWS_ACCESS_KEY_ID" ] && { echo "::error::AWS_ACCESS_KEY_ID (this repo's variable) is empty."; missing=1; }
          [ -z "$SOURCE_AWS_SECRET_ACCESS_KEY" ] && { echo "::error::AWS_SECRET_ACCESS_KEY (this repo's secret) is empty."; missing=1; }
          if [ "$missing" = "1" ]; then
            exit 1
          fi
          echo "All present."

      - name: Copy AWS_ACCESS_KEY_ID variable to the-count
        run: gh variable set AWS_ACCESS_KEY_ID --repo daniellepelley/the-count --body "$SOURCE_AWS_ACCESS_KEY_ID"

      - name: Copy AWS_SECRET_ACCESS_KEY secret to the-count
        run: gh secret set AWS_SECRET_ACCESS_KEY --repo daniellepelley/the-count --body "$SOURCE_AWS_SECRET_ACCESS_KEY"

      - name: Done
        run: |
          echo "Copied AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to daniellepelley/the-count."
          echo "Next: delete this branch, and revoke TARGET_REPO_TOKEN if it was created just for this."
