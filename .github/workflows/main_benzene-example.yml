# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - benzene-example

on:
  workflow_dispatch:

env:
  # This app (Function App "benzene-example") is examples/Asp/Benzene.Example.Asp - same deploy
  # target as deploy-asp-example.yml. The repo root itself has no single project/solution to build
  # (it holds both Benzene.sln and Benzene.Examples.sln), so '.' here made `dotnet build`
  # ambiguous (MSB1011) and this workflow could never succeed as written.
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'examples/Asp/Benzene.Example.Asp' # path to the web app project
  DOTNET_VERSION: '10.0.x' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet build --configuration Release --output ./output
          popd

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'benzene-example'
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4C1C878C93B64C28A4CCF24393864E96 }}
