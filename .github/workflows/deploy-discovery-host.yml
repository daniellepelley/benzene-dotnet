# Publishes the Benzene.Mesh.Discovery.Host Docker image to GHCR
# (ghcr.io/<owner>/benzene-mesh-discovery). Mirrors deploy-mesh-host.yml: manual workflow_dispatch
# only - nothing here (or anywhere else in this repo) auto-publishes.
#
# Uses the built-in GITHUB_TOKEN for GHCR auth (no separate secret needed), requiring the
# "packages: write" permission below.

name: Deploy Discovery Host

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine image tags
      id: tags
      run: |
        IMAGE="ghcr.io/${{ github.repository_owner }}/benzene-mesh-discovery"
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        echo "sha_tag=$IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "latest_tag=$IMAGE:latest" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        # Build context is the repo root - Benzene.Mesh.Discovery.Host references sibling src/
        # projects by relative path, so the whole repo has to be in the build context (see the
        # Dockerfile's own comment).
        context: .
        file: deploy/Discovery/Benzene.Mesh.Discovery.Host/Dockerfile
        push: true
        tags: |
          ${{ steps.tags.outputs.sha_tag }}
          ${{ steps.tags.outputs.latest_tag }}
