name: Mesh Example AWS Logs

# Manual-only diagnostic: tails the mesh Lambda's CloudWatch Logs for a given filter pattern, using
# the same AWS credentials examples/AwsMesh's own deploy workflow uses. Read-only - makes no changes
# to the deployed stack. Useful when the Mesh UI reports a server-side error (e.g. a 503 on an
# artifact fetch) whose real exception is deliberately redacted from the HTTP response
# (Benzene.Mesh.Artifacts.MeshArtifactMiddleware logs it server-side but never returns it to the
# client - see that file's remarks).
on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region"
        required: true
        default: "eu-west-1"
      function_name:
        description: "Lambda function name to read logs from"
        required: true
        default: "benzene-mesh-mesh"
      s3_bucket:
        description: "If set, also head/get these artifact keys directly from this S3 bucket (bypassing the Lambda entirely) - e.g. to check object size/existence independent of the serving Lambda."
        required: false
        default: ""
      filter_pattern:
        description: 'CloudWatch Logs filter pattern (e.g. "Mesh artifact read failed" or "ERROR")'
        required: false
        default: ""
      since_minutes:
        description: "How far back to search, in minutes"
        required: true
        default: "60"

permissions:
  contents: read

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Verify AWS credentials are available
        env:
          KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          [ -z "$KEY_ID" ] && { echo "::error::AWS_ACCESS_KEY_ID is empty (checked both vars and secrets)."; missing=1; }
          [ -z "$SECRET" ] && { echo "::error::AWS_SECRET_ACCESS_KEY is empty in this job."; missing=1; }
          if [ "$missing" = "1" ]; then
            echo "::error::In the 'test' GitHub Environment: set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - name: Fetch CloudWatch Logs
        env:
          FUNCTION_NAME: ${{ inputs.function_name }}
          FILTER_PATTERN: ${{ inputs.filter_pattern }}
          SINCE_MINUTES: ${{ inputs.since_minutes }}
        run: |
          LOG_GROUP="/aws/lambda/${FUNCTION_NAME}"
          START_TIME_MS=$(( ($(date +%s) - SINCE_MINUTES * 60) * 1000 ))
          echo "Log group: $LOG_GROUP"
          echo "Since: $(date -u -d "@$((START_TIME_MS / 1000))" 2>/dev/null || date -u -r $((START_TIME_MS / 1000)))"
          echo "Filter pattern: ${FILTER_PATTERN:-<none>}"
          echo "---"
          if [ -n "$FILTER_PATTERN" ]; then
            aws logs filter-log-events \
              --log-group-name "$LOG_GROUP" \
              --start-time "$START_TIME_MS" \
              --filter-pattern "$FILTER_PATTERN" \
              --query 'events[*].message' \
              --output text
          else
            aws logs filter-log-events \
              --log-group-name "$LOG_GROUP" \
              --start-time "$START_TIME_MS" \
              --query 'events[*].message' \
              --output text
          fi

      # Fallback for exactly the case CloudWatch Logs can't answer: MeshArtifactMiddleware's own
      # exception is deliberately never returned to the HTTP client (no detail leakage - see its
      # remarks and MeshArtifactMiddlewareTest's "no leakage" assertion) and, in practice, may also
      # never reach CloudWatch if this Lambda has no ILogger sink wired up. X-Ray captures a fault on
      # the failing AWS SDK subsegment (S3 GetObject) with the real exception regardless of app-level
      # logging, as long as the request was sampled.
      - name: Fetch X-Ray fault traces
        env:
          SINCE_MINUTES: ${{ inputs.since_minutes }}
        run: |
          START_TIME=$(date -u -d "@$(( $(date +%s) - SINCE_MINUTES * 60 ))" +%Y-%m-%dT%H:%M:%S 2>/dev/null \
            || date -u -r $(( $(date +%s) - SINCE_MINUTES * 60 )) +%Y-%m-%dT%H:%M:%S)
          END_TIME=$(date -u +%Y-%m-%dT%H:%M:%S)
          echo "Window: $START_TIME .. $END_TIME (UTC)"
          echo "--- Fault trace summaries ---"
          SUMMARIES=$(aws xray get-trace-summaries \
            --start-time "$START_TIME" --end-time "$END_TIME" \
            --filter-expression 'fault' \
            --query 'TraceSummaries[*].Id' --output text)
          echo "$SUMMARIES"
          if [ -z "$SUMMARIES" ]; then
            echo "No faulted traces found in this window."
            exit 0
          fi
          echo "--- Fault trace detail (raw segment documents - each is its own JSON string) ---"
          aws xray batch-get-traces --trace-ids $SUMMARIES \
            --query 'Traces[*].Segments[*].Document' --output json

      # Reads the artifacts straight from S3, bypassing the Lambda/API-Gateway/OIDC gate entirely -
      # tells us whether the objects genuinely exist and are readable (a Lambda-side issue) or are
      # themselves broken/oversized/inaccessible even to a completely different client (a real S3/
      # content issue). Only runs when s3_bucket is set.
      - name: Head/get artifacts directly from S3
        if: ${{ inputs.s3_bucket != '' }}
        env:
          BUCKET: ${{ inputs.s3_bucket }}
        run: |
          for key in manifest.json topics.json topology.json usage.json asyncapi.json; do
            echo "=== $key ==="
            if aws s3api head-object --bucket "$BUCKET" --key "$key" 2>&1; then
              size=$(aws s3api head-object --bucket "$BUCKET" --key "$key" --query ContentLength --output text)
              echo "ContentLength: $size bytes"
              if aws s3api get-object --bucket "$BUCKET" --key "$key" "/tmp/$key" >/dev/null 2>&1; then
                echo "Direct S3 GetObject: OK, $(wc -c < "/tmp/$key") bytes downloaded, first 200 chars:"
                head -c 200 "/tmp/$key"
                echo
              else
                echo "Direct S3 GetObject: FAILED"
              fi
            else
              echo "head-object failed (object missing or inaccessible)"
            fi
            echo
          done
