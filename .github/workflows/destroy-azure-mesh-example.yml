name: Destroy Azure Mesh Example

# Manual-only teardown for examples/AzureMesh — the counterpart of "Deploy Azure Mesh Example".
#
# WHY THIS EXISTS: the deployed demo bills while it merely exists — three Cloud Service Web Apps + the
# mesh Web App on an App Service plan, a Container Registry, and a storage account, none of which stop
# costing when idle. Tear the stack down when you are done demoing and redeploy in minutes.
#
# Uses the SAME remote azurerm state as the deploy workflow, so it destroys exactly what that created.
# The resource group (benzene-mesh-rg) and the Terraform state storage account live OUTSIDE Terraform
# (the config reads the RG as a data source), so a plain `terraform destroy` removes the app resources
# but keeps the tiny state account — a redeploy stays cheap. "Also delete the resource group" opts into
# removing the RG (and with it the state account) for a full, from-scratch cleanup.
on:
  workflow_dispatch:
    inputs:
      location:
        description: "Azure region (must match the region the stack was deployed to)"
        required: true
        default: "westeurope"
      acr_name:
        description: "ACR name used at deploy (globally unique, alphanumeric)"
        required: false
        default: "benzenemesh"
      storage_account:
        description: "Storage account used at deploy (its <name>tfstate account holds the remote state)"
        required: false
        default: "benzenemesh"
      delete_resource_group:
        description: "Also delete the resource group benzene-mesh-rg (full cleanup; removes the Terraform state account too)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  RG: benzene-mesh-rg
  PROJECT: benzene-mesh

jobs:
  destroy:
    runs-on: ubuntu-latest
    # The AZURE_CREDENTIALS secret lives in the "test" GitHub Environment; a job must declare the
    # environment for its secrets to be exposed (matching the deploy workflow).
    environment: test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3

      # Point at the same remote state the deploy wrote. If the state storage account is missing there
      # is nothing deployed (or it was deployed elsewhere) — say so plainly rather than creating one.
      - name: Terraform init (remote azurerm state)
        working-directory: examples/AzureMesh/deploy
        env:
          STATE_SA: ${{ inputs.storage_account }}tfstate
        run: |
          if ! az storage account show -g "$RG" -n "$STATE_SA" >/dev/null 2>&1; then
            echo "::error::No Terraform state account ($STATE_SA) in resource group $RG — nothing to destroy here."
            echo "::error::Check the storage_account input matches the deploy, and that you're on the right subscription."
            exit 1
          fi
          terraform init -input=false \
            -backend-config="resource_group_name=$RG" \
            -backend-config="storage_account_name=$STATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=azure-mesh.tfstate"

      # Destroy exactly what deploy created. image_tag is irrelevant to a destroy (nothing is pulled),
      # so its default is fine; the vars below just have to match the state's identifying values.
      - name: Terraform destroy
        working-directory: examples/AzureMesh/deploy
        run: |
          terraform destroy -input=false -auto-approve \
            -var "location=${{ inputs.location }}" \
            -var "acr_name=${{ inputs.acr_name }}" \
            -var "storage_account=${{ inputs.storage_account }}"

      # Full cleanup: delete the resource group itself (removes the state account and anything Terraform
      # didn't track). --no-wait returns immediately; Azure completes the delete in the background.
      - name: Delete the resource group
        if: ${{ inputs.delete_resource_group }}
        continue-on-error: true
        run: |
          echo "Deleting resource group $RG (this removes the Terraform state account too)"
          az group delete -n "$RG" --yes --no-wait || true

      - name: Confirm teardown
        run: |
          echo "AzureMesh stack destroyed in ${{ inputs.location }}."
          if [ "${{ inputs.delete_resource_group }}" = "true" ]; then
            echo "Resource group $RG deletion was requested (completing in the background)."
          else
            echo "Kept resource group $RG and the Terraform state account for a cheap redeploy."
          fi
