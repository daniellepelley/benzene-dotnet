# The HTTP leg - a normal Deployment + Service, exactly like docs/getting-started-kubernetes.md's
# plain single-service walkthrough.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: k8s-transports
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      containers:
        - name: orders-api
          image: benzene-k8stransports-api:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: k8s-transports
spec:
  selector: { app: orders-api }
  ports: [{ port: 80, targetPort: 8080 }]
