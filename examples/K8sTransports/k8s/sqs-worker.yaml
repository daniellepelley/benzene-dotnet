# The SQS leg - a worker Deployment with no Service (nothing calls it; it calls out to SQS). No
# bundled SQS here: QUEUE_URL points at a real queue, and SQS_SERVICE_URL is left UNSET so
# AmazonSQSClient() falls through to the SDK's default credential chain - on EKS that's an IRSA
# role bound to `serviceAccountName` below (see AWS's "IAM roles for service accounts" docs), the
# same pattern every other Benzene AWS client on Kubernetes uses. For a credential-free local run
# against LocalStack instead, see ../compose/docker-compose.yml, which sets SQS_SERVICE_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-sqs-worker
  namespace: k8s-transports
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-sqs-worker }
  template:
    metadata:
      labels: { app: orders-sqs-worker }
    spec:
      # serviceAccountName: orders-sqs-worker   # bind this to an IRSA role with sqs:ReceiveMessage/
                                                 # DeleteMessage/GetQueueAttributes on the queue below
      containers:
        - name: orders-sqs-worker
          image: benzene-k8stransports-sqs-worker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: QUEUE_URL
              value: "https://sqs.eu-west-1.amazonaws.com/<account-id>/orders"   # <- replace
