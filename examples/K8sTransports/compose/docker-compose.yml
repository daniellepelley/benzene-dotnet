# Local, no-Kubernetes-needed way to see all three legs of this example running - in one container -
# against real (if emulated) SQS and Kafka. Each service's build.context is relative to this file, so
# run it from anywhere with `docker compose -f examples/K8sTransports/compose/docker-compose.yml up
# --build` (see the README for the full walkthrough). localstack/kafka here stand in for a real AWS
# SQS queue and a real Kafka cluster - swap them for QUEUE_URL/KAFKA_BOOTSTRAP_SERVERS pointed at the
# real thing to run the exact same image anywhere else, including the k8s/ manifest in the parent
# directory.
services:
  localstack:
    image: localstack/localstack:3
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=eu-west-1
    ports:
      - "4566:4566"

  sqs-init:
    image: amazon/aws-cli:2.17.62
    depends_on:
      - localstack
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=eu-west-1
    entrypoint:
      - sh
      - -c
      - |
        until aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name orders; do sleep 2; done

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  orders-app:
    build:
      context: ../../..
      dockerfile: examples/K8sTransports/App/Dockerfile
    depends_on:
      - sqs-init
      - kafka
    ports:
      - "8080:8080"
    environment:
      - QUEUE_URL=http://localstack:4566/000000000000/orders
      - SQS_SERVICE_URL=http://localstack:4566
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
